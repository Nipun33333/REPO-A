
name: Daily YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      video_type:
        description: "Manual run mode. Use auto for normal schedule."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - shorts
          - long

  schedule:
    # Monday-Friday: 3 Shorts
    - cron: "0 20 * * 1-5"
      timezone: "Asia/Kolkata"

    - cron: "0 22 * * 1-5"
      timezone: "Asia/Kolkata"

    - cron: "30 0 * * 2-6"
      timezone: "Asia/Kolkata"

    # Saturday: 1 Long Video
    - cron: "0 17 * * 6"
      timezone: "Asia/Kolkata"

    # Sunday: 1 Long Video
    - cron: "0 17 * * 0"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: daily-youtube-pipeline-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================
      # NEW: EDGE TTS REAL CONNECTION TEST
      # ======================================

      - name: Test Edge TTS Directly
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import os
          import sys
          import importlib.metadata
          import edge_tts

          print("=" * 45)
          print("EDGE TTS DIAGNOSTIC TEST")
          print("=" * 45)

          version = importlib.metadata.version("edge-tts")
          print("Installed Edge TTS version:", version)

          async def test_edge_tts():
              voice = "en-US-AndrewNeural"

              print("Voice:", voice)
              print("Testing Microsoft Edge TTS...")
              print("Generating sample audio...")

              communicator = edge_tts.Communicate(
                  text="Hello, this is a test of Microsoft Edge Text to Speech.",
                  voice=voice,
                  rate="-5%",
                  pitch="-3Hz",
              )

              output = "/tmp/edge_tts_test.mp3"

              await asyncio.wait_for(
                  communicator.save(output),
                  timeout=60
              )

              if not os.path.isfile(output):
                  raise RuntimeError(
                      "Edge TTS did not create audio file"
                  )

              size = os.path.getsize(output)

              print("Generated audio size:", size)

              if size < 1000:
                  raise RuntimeError(
                      "Edge TTS returned invalid or empty audio"
                  )

              print("=" * 45)
              print("EDGE TTS TEST PASSED")
              print("Real audio generated successfully")
              print("=" * 45)

          try:
              asyncio.run(test_edge_tts())

          except Exception as error:
              print("=" * 45)
              print("EDGE TTS TEST FAILED")
              print("=" * 45)

              print(
                  "Error Type:",
                  type(error).__name__
              )

              status = getattr(
                  error, "status", None
              )

              if status is not None:
                  print("HTTP Status:", status)

              if status == 403:
                  print(
                      "Microsoft Edge TTS rejected the request."
                  )
                  print(
                      "Possible endpoint or access restriction."
                  )

              elif isinstance(error, asyncio.TimeoutError):
                  print(
                      "Edge TTS connection timed out."
                  )

              elif isinstance(error, edge_tts.exceptions.NoAudioReceived):
                  print(
                      "Edge TTS returned no audio."
                  )

              else:
                  print(
                      "Check TTS connection, voice and library."
                  )

              sys.exit(1)
          PY

      # ======================================
      # EXISTING VIDEO PIPELINE
      # ======================================

      - name: Force compatible MoviePy
        run: |
          python -m pip uninstall -y moviepy || true
          python -m pip install "moviepy==1.0.3"
          python -c "import moviepy; print('MoviePy version:', moviepy.__version__); import moviepy.editor; print('moviepy.editor import: OK')"

      - name: Install yt-dlp EJS
        run: |
          python -m pip install -U "yt-dlp[default]"

      - name: Verify YouTube OAuth before video generation
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m uploader.oauth_preflight

      - name: Resolve scheduled video type
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_VIDEO_TYPE: ${{ inputs.video_type }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$MANUAL_VIDEO_TYPE" ] || [ "$MANUAL_VIDEO_TYPE" = "auto" ]; then
              echo "PIPELINE_VIDEO_TYPE=" >> "$GITHUB_ENV"
            else
              echo "PIPELINE_VIDEO_TYPE=$MANUAL_VIDEO_TYPE" >> "$GITHUB_ENV"
            fi
          elif [ "$SCHEDULE_CRON" = "0 20 * * 1-5" ] || [ "$SCHEDULE_CRON" = "0 22 * * 1-5" ] || [ "$SCHEDULE_CRON" = "30 0 * * 2-6" ]; then
            echo "PIPELINE_VIDEO_TYPE=shorts" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_VIDEO_TYPE=long" >> "$GITHUB_ENV"
          fi

      - name: Run AI video pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PIPELINE_TIMEZONE: Asia/Kolkata
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          VIDEO_PRIVACY: public
        run: |
          python -m pipeline

      - name: Save pipeline history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.txt used_media.json

          if git diff --cached --quiet; then
            echo "No new pipeline history to save"
          else
            git commit -m "Update YouTube pipeline history"
            git push
          fi
