
name: Transfer All Secrets to NEW

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Verify destination access
        env:
          GH_TOKEN: ${{ secrets.REPO_TRANSFER_TOKEN }}
          TARGET_REPO: Nipun33333/NEW
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_TRANSFER_TOKEN is missing"
            exit 1
          fi

          if ! gh api \
            "repos/$TARGET_REPO/actions/secrets/public-key" \
            --silent; then
            echo "::error::Cannot access NEW secrets."
            echo "Check repo name and PAT Secrets permissions."
            exit 1
          fi

          echo "Destination access verified"

      - name: Copy all available secrets
        env:
          SOURCE_SECRETS: ${{ toJSON(secrets) }}
          TRANSFER_TOKEN: ${{ secrets.REPO_TRANSFER_TOKEN }}
          TARGET_REPO: Nipun33333/NEW
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          secrets = json.loads(os.environ["SOURCE_SECRETS"])
          target = os.environ["TARGET_REPO"]

          excluded = {
              "GITHUB_TOKEN",
              "REPO_TRANSFER_TOKEN",
              "TRANSFER_PAT",
          }

          gh_env = {
              "GH_TOKEN": os.environ["TRANSFER_TOKEN"],
              "PATH": os.environ["PATH"],
              "HOME": os.environ["HOME"],
          }

          copied = 0
          failed = 0

          for name, value in sorted(secrets.items()):
              if name.upper() in excluded:
                  continue

              if not value:
                  print(f"Skipping empty secret: {name}")
                  continue

              result = subprocess.run(
                  [
                      "gh", "secret", "set", name,
                      "--repo", target,
                      "--app", "actions",
                  ],
                  input=value,
                  text=True,
                  capture_output=True,
                  env=gh_env,
              )

              if result.returncode == 0:
                  copied += 1
                  print(f"Copied: {name}")
              else:
                  failed += 1
                  print(f"FAILED: {name}")

          print(f"Copied: {copied}; Failed: {failed}")

          if failed or copied == 0:
              sys.exit(1)
          PY
