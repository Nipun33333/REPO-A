
name: Transfer Secrets to YTADGENT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    name: Copy All Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Verify Destination Access
        env:
          GH_TOKEN: ${{ secrets.REPO_TRANSFER_TOKEN }}
          TARGET_REPO: Nipun33333/YTADGENT
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_TRANSFER_TOKEN missing"
            exit 1
          fi

          if ! gh api \
            "repos/$TARGET_REPO/actions/secrets/public-key" \
            --silent; then
            echo "::error::Destination access denied"
            echo "Check PAT permissions for YTADGENT"
            exit 1
          fi

          echo "Destination access verified"

      - name: Transfer All Secrets Securely
        env:
          GH_TOKEN: ${{ secrets.REPO_TRANSFER_TOKEN }}
          SOURCE_SECRETS_JSON: ${{ toJSON(secrets) }}
          TARGET_REPO: Nipun33333/YTADGENT
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          secrets = json.loads(
              os.environ["SOURCE_SECRETS_JSON"]
          )

          target = os.environ["TARGET_REPO"]

          excluded = {
              "GITHUB_TOKEN",
              "REPO_TRANSFER_TOKEN",
              "TRANSFER_PAT",
          }

          gh_env = {
              key: os.environ[key]
              for key in ("GH_TOKEN", "PATH", "HOME")
              if key in os.environ
          }

          copied = 0
          failed = 0
          skipped = 0

          for name, value in sorted(secrets.items()):

              if name.upper() in excluded or not value:
                  skipped += 1
                  continue

              result = subprocess.run(
                  [
                      "gh",
                      "secret",
                      "set",
                      name,
                      "--repo",
                      target,
                      "--app",
                      "actions",
                  ],
                  input=value,
                  text=True,
                  capture_output=True,
                  env=gh_env,
              )

              if result.returncode == 0:
                  copied += 1
                  print(f"SUCCESS: {name}")
              else:
                  failed += 1
                  print(f"FAILED: {name}")

          print("-----------------------------")
          print(f"Copied: {copied}")
          print(f"Failed: {failed}")
          print(f"Skipped: {skipped}")
          print("-----------------------------")

          if failed > 0 or copied == 0:
              sys.exit(1)

          print("Secret transfer completed")
          PY
