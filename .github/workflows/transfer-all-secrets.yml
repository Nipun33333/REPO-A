
name: Transfer All Secrets to NEW

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover repository secrets
    runs-on: ubuntu-latest

    outputs:
      secret_names: ${{ steps.list.outputs.secret_names }}

    steps:
      - name: List source secret names
        id: list
        env:
          GH_TOKEN: ${{ secrets.REPO_TRANSFER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/secrets?per_page=100")

          names=$(printf '%s' "$response" | jq -c \
            '[.secrets[].name |
              select(. != "REPO_TRANSFER_TOKEN")]')

          echo "secret_names=$names" >> "$GITHUB_OUTPUT"

          count=$(printf '%s' "$names" | jq 'length')
          echo "Secrets found: $count"

  transfer:
    name: Copy secret
    needs: discover
    if: ${{ needs.discover.outputs.secret_names != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        secret_name: ${{ fromJSON(needs.discover.outputs.secret_names) }}

    steps:
      - name: Securely copy secret to NEW
        env:
          GH_TOKEN: ${{ secrets.REPO_TRANSFER_TOKEN }}
          SOURCE_VALUE: ${{ secrets[matrix.secret_name] }}
          SECRET_NAME: ${{ matrix.secret_name }}
          TARGET_REPO: ${{ github.repository_owner }}/NEW
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SOURCE_VALUE" ]]; then
            echo "::error::Missing or empty secret: $SECRET_NAME"
            exit 1
          fi

          printf '%s' "$SOURCE_VALUE" |
            gh secret set "$SECRET_NAME" \
              --repo "$TARGET_REPO" \
              --app actions

          echo "Copied successfully: $SECRET_NAME"
